<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 800px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: rgba(20, 20, 40, 0.8);
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-info h2 {
            color: #ffffff;
            font-size: 1.5em;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .room-id {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.8);
        }

        .user-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(45deg, #3742fa, #2f3542);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(55, 66, 250, 0.5);
            border-radius: 4px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 70%;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #ff4757, #ff3742);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.own .message-avatar {
            background: linear-gradient(45deg, #3742fa, #2f3542);
        }

        .message-content {
            background: rgba(40, 40, 60, 0.8);
            padding: 12px 18px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .message.own .message-content {
            background: linear-gradient(45deg, #3742fa, #2f3542);
            border: none;
        }

        .message-username {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .message.own .message-username {
            text-align: right;
        }

        .message-text {
            color: #ffffff;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message-time {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .message.own .message-time {
            text-align: right;
        }

        .system-message {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            align-self: center;
            margin: 10px 0;
        }

        .input-container {
            background: rgba(20, 20, 40, 0.8);
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(40, 40, 60, 0.8);
            color: #ffffff;
        }

        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .message-input:focus {
            border-color: #3742fa;
            box-shadow: 0 0 15px rgba(55, 66, 250, 0.4);
            background: rgba(50, 50, 70, 0.9);
        }

        .send-button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(45deg, #3742fa, #2f3542);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 3px 10px rgba(55, 66, 250, 0.3);
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(55, 66, 250, 0.5);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .connection-status.connected {
            background: rgba(46, 125, 50, 0.2);
            color: #66bb6a;
            border: 1px solid rgba(102, 187, 106, 0.3);
        }

        .connection-status.disconnected {
            background: rgba(211, 47, 47, 0.2);
            color: #ef5350;
            border: 1px solid rgba(239, 83, 80, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="room-info">
                <h2 id="roomName">Chat Room</h2>
                <div class="room-id" id="roomIdDisplay">Room ID: -</div>
            </div>
            <div class="user-info">
                <div class="user-icon" id="userIcon">U</div>
                <span id="usernameDisplay">User</span>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="system-message">Welcome to the chat room!</div>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="messageInput" 
                class="message-input" 
                placeholder="Type a message..."
                maxlength="500"
            >
            <button class="send-button" id="sendButton" title="Send message">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="connection-status disconnected" id="connectionStatus">
        <span class="status-dot"></span>
        <span id="statusText">Disconnected</span>
    </div>

    <script>
        let conn = null;
        let username = '';
        let roomId = '';

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            roomId = urlParams.get('roomId');
            username = urlParams.get('username');

            if (!roomId || !username) {
                alert("Room ID and Username are required.");
                window.location.href = '/';
                return;
            }

            // Display room info
            document.getElementById('roomIdDisplay').textContent = `Room ID: ${roomId}`;
            document.getElementById('usernameDisplay').textContent = username;
            document.getElementById('userIcon').textContent = username.charAt(0).toUpperCase();

            // Connect to WebSocket
            connectWebSocket();

            // Set up event listeners
            setupEventListeners();
        };

        function connectWebSocket() {
            if (window['WebSocket']) {
                conn = new WebSocket(`ws://${window.location.host}/ws`);

                conn.onmessage = function(ev) {
                    const message = JSON.parse(ev.data)
                    console.log(message)
                    handleIncomingMessage(message)
                }
                
                
            } else {
                console.error("WebSocket not supported in this browser.");
                alert("Your browser doesn't support WebSocket. Please use a modern browser.");
            }
        }

        function setupEventListeners() {
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');

            sendButton.addEventListener('click', sendMessage);
            
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const messageText = messageInput.value.trim();

            if (!messageText || !conn || conn.readyState !== WebSocket.OPEN) {
                return;
            }

            conn.send(messageText)
            const message = {
                username: username,
                text: messageText
            }
            displayMessage(message)
        }

        function handleIncomingMessage(message) {
            displayMessage(message)
            
        }

        function displayMessage(message) {
            const messagesContainer = document.getElementById('messagesContainer');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${message.own ? 'own' : ''}`;

            const time = new Date(message.timestamp || new Date()).toLocaleTimeString([], { 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            messageEl.innerHTML = `
                <div class="message-avatar">${message.username}</div>
                <div class="message-content">
                    <div class="message-username">${message.username}</div>
                    <div class="message-text">${escapeHtml(message.text)}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            messagesContainer.appendChild(messageEl);
            scrollToBottom();
        }

        function displaySystemMessage(text) {
            const messagesContainer = document.getElementById('messagesContainer');
            const messageEl = document.createElement('div');
            messageEl.className = 'system-message';
            messageEl.textContent = text;
            messagesContainer.appendChild(messageEl);
            scrollToBottom();
        }

        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('connectionStatus');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                statusEl.className = 'connection-status connected';
                statusText.textContent = 'Connected';
            } else {
                statusEl.className = 'connection-status disconnected';
                statusText.textContent = 'Disconnected';
            }
        }

        function scrollToBottom() {
            const messagesContainer = document.getElementById('messagesContainer');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
